<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>사전미션 확인증 · Law-Impact</title>
<meta property="og:title" content="Law-Impact 사전미션 확인증">
<meta property="og:description" content="미션을 끝낼 때마다 도장이 하나씩 찍혀요.">
<meta name="theme-color" content="#b8e3f6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* 브로슈어 톤: 하늘색 바탕, 검은 굵은 테두리의 흰 상자, 동그라미 점 장식, 01·02·03 검은 원 번호 */
:root {
	--sky: #b8e3f6;
	--lime: #aee67e;
	--ink: #141414;
	--paper: #ffffff;
	--muted: #5b6670;
	--c1: #1f5fbf;
	--c2: #2f8f3a;
	--c3: #0e80aa;
	--gold: #f2c94c;
	--sans: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
	color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
	background: var(--sky);
	color: var(--ink);
	font-family: var(--sans);
	-webkit-text-size-adjust: 100%;
}
.wrap {
	max-width: 440px;
	margin: 0 auto;
	padding: max(18px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(28px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
}

/* 머리글 */
.top {
	margin: -18px -16px 18px;
	padding: 26px 22px 20px;
	background: var(--paper);
	border-bottom: 2px solid var(--ink);
	position: relative;
}
.eyebrow { margin: 0; font-size: 12.5px; font-weight: 900; letter-spacing: .14em; color: var(--ink); }
.eyebrow b { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--ink); margin: 0 6px 2px 0; vertical-align: middle; }
.title { margin: 6px 0 4px; font-size: 32px; font-weight: 900; letter-spacing: -.02em; line-height: 1.15; }
.title .leaf { font-size: 22px; vertical-align: 6px; margin-left: 4px; }
.lead { margin: 0; max-width: calc(100% - 78px); font-size: 14px; color: var(--c1); font-weight: 700; line-height: 1.5; }
.top-char { position: absolute; right: 12px; bottom: 6px; width: 72px; height: auto; }

/* 상자 공통: 브로슈어의 점 장식 머리 */
.box {
	background: var(--paper);
	border: 2px solid var(--ink);
	border-radius: 18px;
	margin: 0 0 14px;
	overflow: hidden;
}
.box-head {
	display: flex;
	align-items: center;
	justify-content: center;
	gap: 10px;
	padding: 9px 12px;
	border-bottom: 2px solid var(--ink);
	font-weight: 900;
	font-size: 15px;
}
.dots { display: inline-flex; gap: 6px; }
.dots i { width: 9px; height: 9px; border-radius: 50%; border: 2px solid var(--ink); display: block; }

/* 참가자 */
.who { display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; padding: 14px 18px 16px; font-size: 16px; }
.who dt { font-weight: 700; color: var(--muted); }
.who dd { margin: 0; font-weight: 900; border-bottom: 1.5px dashed #9aa6af; padding-bottom: 2px; min-width: 0; overflow-wrap: anywhere; }

/* 미션 줄 */
.missions { display: grid; gap: 12px; margin: 0 0 14px; }
.mission {
	display: grid;
	grid-template-columns: 52px 1fr 104px;
	align-items: center;
	gap: 12px;
	padding: 12px 12px 12px 14px;
	background: var(--paper);
	border: 2px solid var(--ink);
	border-radius: 18px;
	position: relative;
}
.num {
	width: 52px; height: 52px;
	border-radius: 50%;
	background: var(--ink);
	display: grid; place-items: center;
	font-weight: 900; font-size: 22px; letter-spacing: -.02em;
}
.m1 .num { color: #ffffff; }
.m2 .num { color: #7fe36c; }
.m3 .num { color: #6fd0f0; }
.info { min-width: 0; }
.info .tag { margin: 0; font-size: 11.5px; font-weight: 700; letter-spacing: .1em; color: var(--muted); }
.info h2 { margin: 1px 0 2px; font-size: 18.5px; font-weight: 900; letter-spacing: -.01em; line-height: 1.25; }
.info p { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.45; }
.info .state { margin-top: 5px; font-size: 12.5px; font-weight: 700; }
.done .state { color: var(--c2); }
.todo .state { color: #8a949c; }

/* 도장 칸: 브로슈어의 톱니 원 */
.slot { position: relative; width: 104px; height: 104px; }
.slot .ring { position: absolute; inset: 0; }
.slot .stamp {
	position: absolute; inset: 2px;
	opacity: 0;
	transform: rotate(var(--r, -10deg)) scale(1);
}
.done .slot .stamp { opacity: .92; }
.slot .empty-label {
	position: absolute; inset: 0; display: grid; place-items: center;
	font-size: 11.5px; font-weight: 700; color: #9aa6af; text-align: center; line-height: 1.3;
}
.done .slot .empty-label { display: none; }

/* 찍히는 순간 */
.mission.just .slot .stamp { animation: slam .55s cubic-bezier(.2, 1.4, .4, 1) both var(--delay, .9s); }
.mission.just { animation: thud .35s ease-out both calc(var(--delay, .9s) + .3s); }
.mission.just .slot::after {
	content: ''; position: absolute; inset: -10px; border-radius: 50%;
	border: 3px solid var(--ink-c, var(--c2));
	opacity: 0;
	animation: ripple .7s ease-out both calc(var(--delay, .9s) + .3s);
}
@keyframes slam {
	0% { opacity: 0; transform: rotate(calc(var(--r, -10deg) - 18deg)) scale(2.6); }
	55% { opacity: .95; transform: rotate(var(--r, -10deg)) scale(.92); }
	100% { opacity: .92; transform: rotate(var(--r, -10deg)) scale(1); }
}
@keyframes thud { 0% { transform: translateY(0); } 30% { transform: translateY(3px); } 100% { transform: translateY(0); } }
@keyframes ripple { 0% { opacity: .55; transform: scale(.7); } 100% { opacity: 0; transform: scale(1.25); } }
.new-badge {
	position: absolute; top: -10px; right: 14px;
	background: #ff5a3c; color: #fff; font-size: 11.5px; font-weight: 900; letter-spacing: .06em;
	padding: 3px 9px; border-radius: 999px; border: 2px solid var(--ink);
	opacity: 0; animation: pop .3s ease-out both calc(var(--delay, .9s) + .5s);
}
@keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* 진행 */
.progress { padding: 14px 18px 16px; }
.progress .row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
.progress .row b { font-size: 22px; font-weight: 900; font-variant-numeric: tabular-nums; }
.progress .row span { font-size: 14px; font-weight: 700; }
.bar { height: 14px; border: 2px solid var(--ink); border-radius: 999px; background: #eef6fb; overflow: hidden; }
.bar i { display: block; height: 100%; width: var(--p, 0%); background: var(--lime); border-right: 2px solid var(--ink); transition: width .8s ease 1.2s; }
.progress p { margin: 10px 0 0; font-size: 13.5px; color: var(--muted); line-height: 1.55; }

/* 완주 리본 */
.finish { display: none; text-align: center; margin: 6px 0 16px; position: relative; }
.all .finish { display: block; }
.finish img { width: 110px; height: auto; display: block; margin: 0 auto -8px; position: relative; z-index: 1; }
.ribbon {
	position: relative; display: inline-block;
	background: var(--paper); border: 2px solid var(--ink);
	padding: 10px 26px; font-weight: 900; font-size: 17px; letter-spacing: -.01em;
}
.ribbon::before, .ribbon::after {
	content: ''; position: absolute; top: 8px; width: 22px; height: 100%;
	background: var(--paper); border: 2px solid var(--ink); z-index: -1;
}
.ribbon::before { left: -16px; clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%, 35% 50%); }
.ribbon::after { right: -16px; clip-path: polygon(0 0, 100% 0, 65% 50%, 100% 100%, 0 100%); }
.ribbon small { display: block; font-size: 12.5px; font-weight: 700; color: var(--muted); margin-top: 2px; }

.sample { margin: 0 0 12px; text-align: center; font-size: 12.5px; font-weight: 700; color: var(--ink); background: var(--gold); border: 2px solid var(--ink); border-radius: 999px; padding: 4px 10px; }
.info .again { display: inline-block; margin-top: 6px; font-size: 12.5px; font-weight: 900; color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
.loading { text-align: center; font-weight: 700; padding: 30px 0; margin: 0; }
.sample[hidden] { display: none; }
.foot { text-align: center; font-size: 12px; color: #3f4a52; margin-top: 18px; }

@media (prefers-reduced-motion: reduce) {
	.mission.just .slot .stamp, .mission.just, .mission.just .slot::after, .new-badge { animation: none !important; opacity: .92; }
	.bar i { transition: none; }
}
</style>
</head>

	/* 톱니 모양 도장 칸 테두리 (브로슈어의 원형 배지 모양) */
	function ring() {
		var pts = [], n = 28, cx = 52, cy = 52;
		for (var i = 0; i < n * 2; i++) {
			var a = Math.PI * i / n, rr = i % 2 ? 46 : 49.5;
			pts.push((cx + Math.cos(a) * rr).toFixed(1) + ',' + (cy + Math.sin(a) * rr).toFixed(1));
		}
		return '<svg class="ring" viewBox="0 0 104 104" aria-hidden="true"><polygon points="' + pts.join(' ') + '" fill="#fff" stroke="#9aa6af" stroke-width="1.6" stroke-dasharray="3 3"/><circle cx="52" cy="52" r="38" fill="none" stroke="#c9d3da" stroke-width="1.4"/></svg>';
	}
	function stampSvg(m) {
		var id = 'tp' + m.key;
		return '<svg class="stamp" viewBox="0 0 104 104" style="--r:' + m.r + 'deg" role="img" aria-label="' + m.name + ' 완료 도장">' +
			'<defs><path id="' + id + 'a" d="M52 52 m-38 0 a38 38 0 1 1 76 0"/><path id="' + id + 'b" d="M52 52 m-40 0 a40 40 0 0 0 80 0"/></defs>' +
			'<circle cx="52" cy="52" r="48" fill="none" stroke="' + m.ink + '" stroke-width="3.2"/>' +
			'<circle cx="52" cy="52" r="43" fill="none" stroke="' + m.ink + '" stroke-width="1.4"/>' +
			'<text font-size="9.5" font-weight="900" letter-spacing="2" fill="' + m.ink + '" font-family="Noto Sans KR, sans-serif"><textPath href="#' + id + 'a" startOffset="50%" text-anchor="middle">LAW-IMPACT</textPath></text>' +
			'<text font-size="9" font-weight="900" letter-spacing="1.5" fill="' + m.ink + '" font-family="Noto Sans KR, sans-serif"><textPath href="#' + id + 'b" startOffset="50%" text-anchor="middle">MISSION ' + ('0' + m.key) + ' CLEAR</textPath></text>' +
			'<image href="' + m.img + '" x="22" y="20" width="60" height="62" preserveAspectRatio="xMidYMid meet"/>' +
			'</svg>';
	}
	function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

	/* 기록 서버(구글 시트) 주소. 주소 뒤 ?k=토큰 으로 그 사람의 도장 현황을 불러온다. */
	var API = 'https://script.google.com/macros/s/AKfycbxSHS3Khev5gl025Rn7GLHUCB9hvEHDc6EU_oZxKuU5kzEJg8i16CqKtTKYF1aQ2Q3BKw/exec';
	/* 미션 공개일: 공개 전에는 이름을 가린다 */
	var OPEN = { 1: '2026-10-23T18:00:00+09:00', 2: '2026-10-30T18:00:00+09:00', 3: '2026-11-06T18:00:00+09:00' };
	var ls = { get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
		set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };

	function md(iso) { var d = new Date(iso); return (d.getMonth() + 1) + '/' + d.getDate(); }

	function render(data, fresh) {
		document.getElementById('v-name').textContent = data.name || '-';
		document.getElementById('v-school').textContent = data.school || '-';
		var done = data.done || [], when = data.when || {};
		var html = '';
		MISSIONS.forEach(function (m) {
			var ok = done.indexOf(m.key) !== -1, isNew = ok && m.key === fresh;
			var open = ok || Date.now() >= new Date(OPEN[m.key]).getTime();
			var title = open ? m.name : 'TOP SECRET', desc = open ? m.desc : md(OPEN[m.key]) + '(금) 저녁 6시 공개';
			html += '<article class="mission ' + m.cls + (ok ? ' done' : ' todo') + (isNew ? ' just' : '') + '" style="--ink-c:' + m.ink + '">' +
				'<div class="num">0' + m.key + '</div>' +
				'<div class="info"><p class="tag">' + m.tag + '</p><h2>' + esc(title) + '</h2><p>' + esc(desc) + '</p>' +
				'<p class="state">' + (ok ? '완료' + (when[m.key] ? ' · ' + esc(when[m.key]) : '') : (open ? '아직 도전 전' : '')) + '</p>' +
				(ok && m.again ? '<a class="again" href="' + m.again + '">결과 다시 보기</a>' : '') + '</div>' +
				'<div class="slot">' + ring() + '<span class="empty-label">도장<br>자리</span>' + stampSvg(m) + '</div>' +
				(isNew ? '<span class="new-badge">NEW 도장!</span>' : '') +
				'</article>';
		});
		document.getElementById('missions').innerHTML = html;

		var n = done.length;
		document.getElementById('v-count').textContent = n + ' / 3';
		var bar = document.getElementById('v-bar');
		requestAnimationFrame(function () { requestAnimationFrame(function () { bar.style.setProperty('--p', (n / 3 * 100) + '%'); }); });
		var msg = n === 0 ? '미션을 끝내고 인증하면 도장이 찍혀요.'
			: n < 3 ? '앞으로 ' + (3 - n) + '개! 남은 미션도 끝내고 같은 번호로 인증해 주세요.'
			: '도장 3개를 모두 모았어요. 11/14 현장에서 이 화면을 보여 주세요!';
		document.getElementById('v-msg').textContent = msg;
		document.getElementById('app').classList.toggle('all', n === 3);
	}
	function notice(text) {
		var el = document.getElementById('sample');
		el.textContent = text; el.hidden = false;
	}

	var q = new URLSearchParams(location.search);
	var token = q.get('k') || ls.get('li-token');
	var fresh = Number(q.get('new') || 0);
	if (q.get('test') === '1') {
		/* 운영진 테스트: 이 기기에만 저장된 테스트 도장 (구글 시트와 무관) */
		var T = {}; try { T = JSON.parse(ls.get('li-test') || '{}'); } catch (e) { T = {}; }
		notice('운영진 테스트 화면이에요. 이 도장은 이 기기에만 있고 구글 시트에는 기록되지 않아요.');
		render({ name: T.name || '-', school: T.school || '-', done: T.done || [], when: T.when || {} }, fresh);
	} else if (token && API.indexOf('http') === 0) {
		document.getElementById('missions').innerHTML = '<p class="loading">도장 카드를 불러오는 중…</p>';
		fetch(API + '?k=' + encodeURIComponent(token))
			.then(function (r) { return r.json(); })
			.then(function (d) {
				if (!d.ok) { throw new Error(d.error || 'fail'); }
				ls.set('li-token', d.token);
				if (!q.get('k')) { history.replaceState(null, '', '?k=' + encodeURIComponent(d.token)); }
				render(d, fresh);
			})
			.catch(function () {
				render({ name: '-', school: '-', done: [] }, 0);
				notice('도장 카드를 찾지 못했어요. 링크를 다시 확인하거나 잠시 후 열어 주세요.');
			});
	} else {
		notice('예시 화면이에요. 미션을 끝내고 인증하면 내 도장 카드가 열려요.');
		render({ name: '김지아', school: '한빛고', done: [1, 2], when: { 1: '10.24', 2: '10.31' } }, 2);
	}
})();
